name: Deploy cloud-mail production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloud-mail-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - name: Check deployment credentials
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Set the CLOUDFLARE_API_TOKEN repository secret before deploying."
            exit 1
          fi
      - uses: pnpm/action-setup@v4.1.0
        with:
          version: 11.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            mail-worker/pnpm-lock.yaml
            mail-vue/pnpm-lock.yaml
      - name: Install Worker dependencies
        working-directory: mail-worker
        run: pnpm install --frozen-lockfile
      - name: Install frontend dependencies
        working-directory: mail-vue
        run: pnpm install --frozen-lockfile
      - name: Deploy
        working-directory: mail-worker
        run: pnpm exec wrangler deploy --config wrangler.jsonc
